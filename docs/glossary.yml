    event type: { match: [ TaskStarted, TaskCompleted, AsyncCompleted, EgressBlocked, PolicyGrantReady ], note: Eventの型名。本文ではバッククォートで囲む。 }
    tool name: { match: [ delegate, ask_parent, escalate, request_grant, await_async, update_progress, cancel_child_task, Delegate, Escalate ], note: Work Agentが呼び出すToolの名前。 }
    schema identifier: { match: [ message-envelope.schema.json, task-episode.schema.json, task_id, contract_version ], note: JSON Schema、参照名、版を示す識別子。 }
    command name: { match: [ kakesu, git, curl, gh, make ], note: CLIで実行するコマンド。本文ではバッククォートで囲む。 }
    transport term: { match: [ message_id, idempotency_key, correlation_id, causation_message_id, ACK ], note: 配送の重複排除、因果関係、確定境界を表す識別子。 }
    URI reference: { match: [ artifact://..., evidence://... ], note: DB recordを指す論理参照。ファイルパスと混同しない。 }
    versioned filename: { match: [ 00-kakesu.md, 13-technology-stack.md, governance.db, control.db, evidence.db ], note: 文書、Schema、またはDBのファイル名。 }
    SQL data type: { match: [ timestamptz ], note: 表定義中または本文中に現れるSQLデータ型。 }
    domain type name: { match: [ ToolCall ], note: 本文ではバッククォートで囲むドメイン型名。 }
review:
  frequent_prose_threshold: 3
  policy: 未登録語は検査時に抽出し、閾値以上の本文出現だけをレビューする。抽出結果はファイルへ保存しない。
normalization:
  - { preferred: Task / Agent / Workspace / Owner / Plane, avoid: task / agent / workspace / owner / plane, reason: Kakesuのドメイン用語は正式名称の大文字表記に統一する。 }
  - { preferred: メッセージ / プロセス / サービス / リクエスト / レスポンス, avoid: message / process / service / request / response, reason: 一般技術語は日本語に訳して本文へ埋め込む。 }
  - { preferred: バッククォートで囲む, avoid: 裸の識別子, reason: 識別子と自然言語を視覚的に分離する。 }
style_principles:
  - 概念を説明する普通名詞は、ドメイン用語という理由だけで英語にせず、自然な日本語を使う。
  - 日本語の技術会話で定着した外来語はカタカナ表記にする。
  - 英語表記を維持するのは、製品名、言語名、規格名、略語、コード識別子、およびSchemaと同じ対象を指す最小限の正式ドメイン名に限定する。
  - 複合語は単語ごとの直訳を連結せず、概念全体として自然な訳語を定義する。
project_terms:
  Kakesu: { description: 長期記憶を次の行動へ活かす、ローカル動作の自律AIハーネス。, definition: 00-kakesu.md#1-目的 }
  Harness: { description: 状態、排他、再開、Workspace、配送、監査を管理するKakesuの実行基盤。, definition: 00-kakesu.md#3-全体アーキテクチャ }
  Agent: { description: 能力プロファイルを持ち、Taskのオーナーになれる継続的な論理主体。, definition: 01-domain-model.md#1-agent }
  Task: { description: 単一オーナーが目的と受け入れ条件に対して責任を持つ作業単位。, definition: 01-domain-model.md#2-task }
  Workspace: { description: Task専用の隔離された論理作業領域であり、セキュリティポリシーの適用単位。, definition: 01-domain-model.md#3-workspace }
  Owner: { description: あるTaskの遂行と完了案の提出に責任を持つAgent。, definition: 01-domain-model.md#オーナー排他 }
  Agent Run: { description: あるAgentがあるTaskを処理する一回の実行セッション。, definition: 01-domain-model.md#4-agent実行 }
  Task Contract: { description: Taskの目的、受け入れ条件、指示、優先順位などを固定する契約。, definition: 01-domain-model.md#2-task }
  Objective: { description: Taskが達成すべき目的。実行中の都合だけでは変更しない。, definition: 01-domain-model.md#taskの成立条件 }
  Acceptance: { description: Taskを完了として受理できるかを判断する受け入れ条件。, definition: 01-domain-model.md#taskの成立条件 }
  Outcome: { description: Taskの終端時に確定する結果。完了時は受理済みレビューを必要とする。, definition: 01-domain-model.md#結果制約 }
  Intake: { description: 人間や外部システムからルートTaskの申請を受け付ける境界。, definition: 02-task-lifecycle.md#2-ルート-task生成 }
  Task Proposal: { description: 親子関係、目的、受け入れ条件、予算を含むTask作成申請。, definition: 02-task-lifecycle.md#3-子-task生成 }
  Task Progress: { description: オーナーが申告するTask内の現在地と未完了項目。, definition: 01-domain-model.md#task進捗 }
  Ledger: { description: Task進捗をTODO形式で保持する永続台帳。, definition: 02-task-lifecycle.md#5-task進捗 }
  SubAgent: { display: SubAgent, description: 親Taskから委譲された子Taskを所有するAgent。, definition: 00-kakesu.md#subagent }
  Ask: { description: 判断責任を移さず、子Taskのオーナーが親へ助言を求める通信。, definition: 02-task-lifecycle.md#質問 }
  Escalation: { description: 現在のTask契約では決められない判断責任を上位へ移す通信。, definition: 02-task-lifecycle.md#上位判断依頼 }
  Completion Candidate: { description: オーナーがTaskの完了条件を満たしたとして提出する完了案。, definition: 02-task-lifecycle.md#7-完了候補と受け入れ条件-レビュー }
  Completion Review: { description: 完了案を現行の受け入れ条件と照合する独立レビュー。, definition: 01-domain-model.md#5-完了レビュー }
  Acceptance Reviewer: { description: 完了案だけを評価し、Taskを実装または修正しない短命なレビュアーAgent。, definition: 04-built-in-agents.md#3-受け入れ条件レビュアー-agent }
  Task Episode: { description: 終端したTaskから作る、時系列の長期記憶単位。, definition: 08-long-term-memory.md#3-taskエピソード }
  Plane: { description: 独立した責務、状態所有権、通信境界を持つ論理コンポーネント群。, definition: 00-kakesu.md#31-実装境界とplane間配送 }
  Control Plane: { description: Task、再開、メールボックス、人間との通信境界を管理するPlane。, definition: 00-kakesu.md#24-人間との通信境界をcontrol-planeへ一元化 }
  Work Agent Plane: { description: 目的理解、計画、実装、調査、委譲、完了案提出を担うPlane。, definition: 00-kakesu.md#2-基本原則 }
  Execution Plane: { description: Workspace内のコマンドやツール実行を担うPlane。, definition: 13-technology-stack.md#1-選定結果 }
  Governance Plane: { description: 外向き通信、認証情報、許可、監査、ポリシーを強制するPlane。, definition: 07-governance.md#1-信頼境界 }
  Memory Plane: { description: 証跡からTaskエピソードと意味記憶を構築するPlane。, definition: 08-long-term-memory.md#1-目的 }
  Mailbox: { description: Task宛ての非同期結果や統治イベントを順序付きで保持する受信箱。, definition: 06-tools-and-async.md#13-メールボックスイベント }
  Outbox: { description: Plane内の状態変更と同じトランザクションで保存する送信待ちメッセージのキュー。, definition: 13-technology-stack.md#5-plane間通信 }
  Inbox: { description: 受信メッセージを重複排除して永続化する受信キュー。, definition: 13-technology-stack.md#5-plane間通信 }
  Async Operation: { description: 同期期限を超えて継続し、後から結果を返す操作の永続記録。, definition: 11-data-model.md#async_operations }
  Continuation: { description: Taskを後から安全に再開するために固定する待機理由と再開情報。, definition: 11-data-model.md#continuations }
  Egress Challenge: { display: 外向き通信の許可確認, description: 外向き通信がルールで拒否されたことと、許可申請の対象を固定する記録。, definition: 07-governance.md#6-外向き通信-試行と許可確認 }
  Policy Grant: { description: 特定のWorkspace、Task、通信内容、期限へ束縛した一時許可。, definition: 07-governance.md#11-一時許可 }
  Policy Binding: { description: Workspaceへ適用するポリシーとバージョンの割り当て。, definition: 07-governance.md#11-実装永続化境界 }
  Human Authority: { description: 人間の判断が必要なときに、認証済み回答を返す責任者。, definition: 07-governance.md#13-責任者 }
  Authority Gateway: { description: 人間の責任者への依頼と回答を一元管理するControl Planeの境界。, definition: 00-kakesu.md#24-人間との通信境界をcontrol-planeへ一元化 }
  Policy Agent: { description: 外向き通信の許可判断と恒久ルール改定案を作る独立Agent。, definition: 07-governance.md#10-ポリシーagent }
  Egress Audit Agent: { description: 通過後の外向き通信を調査し、見逃しや異常を検出するAgent。, definition: 07-governance.md#16-監査事後検知ポリシー改善 }
  Incident: { description: 安全性または統治上の異常に対して封じ込めと復旧を要する事象。, definition: 02-task-lifecycle.md#インシデントによるtask-tree-suspension }
  Containment: { description: インシデントの影響を起点Task、その祖先、子孫へ限定して停止する処置。, definition: 02-task-lifecycle.md#インシデントによるtask-tree-suspension }
  Evidence: { description: 再開、完了判定、監査、長期記憶を裏付ける不変または検証可能な証跡。, definition: 08-long-term-memory.md#4-証跡-レイヤー }
  Semantic Wiki: { display: 意味Wiki, description: 概念、スキーマ、スクリプト、ケースパターンを関係付きで保持する意味記憶。, definition: 09-semantic-wiki-schema.md }
