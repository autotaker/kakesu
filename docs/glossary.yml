version: 2
title: Kakesu用語集
# 人が承認した表記ルールだけを保持する。抽出語や出現回数は保存しない。
scope:
  sources: ['**/*.md']
  language: japanese
  excludes:
    - .agents/**
    - .build/**
    - .pytest_cache/**
    - node_modules/**
    - tasks/**
    - wiki/**
    - "**/.venv/**"
    - "**/target/**"
rules:
  # formal name: {to: 本文表記, match: [検出表記], aliases: [検査対象外の別名], note: 意味}
  # match省略時はformal name自体を検出する。aliasesは頻出語レビューの登録済み判定だけに使う。
  replacements:
    message: { to: メッセージ, aliases: [ msg ], note: Plane間で配送する意味単位。 }
    process: { to: プロセス, match: [ process, Process ], note: OSが管理する実行単位。 }
    service: { to: サービス, match: [ service, Service ], aliases: [ svc ], note: 独立した機能提供単位。 }
    component: { to: コンポーネント, note: 内部の責務を持つ実装単位。 }
    request: { to: リクエスト, match: [ request, Request ], note: 処理や権限を要求するメッセージ。 }
    response: { to: レスポンス, match: [ response, Response ], note: リクエストに対する応答。 }
    event: { to: イベント, match: [ event, Event, Events ], note: 発生した事実を表す記録。 }
    database: { to: データベース, match: [ database, Database ], aliases: [ DB, db ], note: 永続状態を保持する保存先。略称DBは固有の説明でのみ使う。 }
    repository: { to: リポジトリ, aliases: [ repo ], note: GitまたはSemantic Wikiの管理単位。 }
    query: { to: クエリ, match: [ query, Query ], note: 保存データへの検索・参照要求。 }
    timeout: { to: タイムアウト, note: 指定時間内に処理が完了しない状態または期限。 }
    retry: { to: 再試行, aliases: [ リトライ ], note: 失敗した処理を同一の入力で再実行すること。 }
    workflow: { to: ワークフロー, match: [ workflow, Workflow ], note: 複数の処理と状態遷移からなる流れ。 }
    runtime: { to: ランタイム, match: [ runtime, Runtime ], note: 実行中の処理を管理する基盤。 }
    input: { to: 入力, match: [ input, Input ], note: 処理へ渡すデータ。 }
    output: { to: 出力, match: [ output, Output ], note: 処理から返されるデータ。 }
    error: { to: エラー, match: [ error, Error ], aliases: [ エラー情報 ], note: 処理が正常完了しなかったことを表す情報。 }
    scope: { to: スコープ, match: [ scope, Scope ], note: 権限、適用範囲、または対象を限定する境界。 }
    version: { to: バージョン, note: 契約や状態の版を識別する値。 }
    digest: { to: ダイジェスト, aliases: [ ハッシュ値 ], note: 内容の同一性を検証する要約値。 }
    snapshot: { to: スナップショット, match: [ snapshot, Snapshot ], note: ある時点で固定した入力または状態。 }
    payload: { to: ペイロード, note: メッセージに含める業務データ。 }
    field: { to: フィールド, aliases: [ 項目 ], note: Schemaまたはレコードの属性。 }
    channel: { to: チャネル, note: 同一プロセス内の通知・受け渡し経路。 }
    connection: { to: 接続, note: 外部または内部の通信経路。 }
    network: { to: ネットワーク, match: [ network, Network ], note: 通信対象と通信経路の集合。 }
    protocol: { to: プロトコル, note: 通信の形式と手順。 }
